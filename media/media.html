<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MilaWorks — Media / Visuals</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #0d0d0f;
    color: #e6e6e6;
    font-family: 'Orbitron', sans-serif;
}

.cyber-nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(8, 8, 8, 0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #2a2a2a;
    z-index: 999;
}
.nav-logo {
    font-family: 'Monoton', cursive;
    font-size: 1.8rem;
    color: #d7ff3f;
    text-shadow: 0 0 8px #d7ff3f;
}
.nav-links { display: flex; gap: 35px; }
.nav-links a {
    color: #e6e6e6;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: 0.3s;
}
.nav-links a:hover {
    color: #d7ff3f;
    text-shadow: 0 0 10px #d7ff3f;
}

.section {
    max-width: 1000px;
    margin: auto;
    padding: 120px 20px 40px;
}

h1 {
    font-family: 'Monoton', cursive;
    font-size: 3rem;
    text-shadow: 0 0 10px #7f5af0;
}

.serpent-divider {
    width: 100%;
    height: 120px;
    background: url("https://ts3.mm.bing.net/th?id=OIP.ZZf7s6KnEMsMTA6x5_5O6QHaHa&pid=15.1&o=7&rm=3") center/contain no-repeat;
    filter: drop-shadow(0 0 20px #7f5af0);
    margin: 40px 0;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.gallery img {
    width: 100%;
    border-radius: 10px;
    box-shadow: 0 0 15px #7f5af0;
    transition: 0.3s;
}
.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #d7ff3f;
}
</style>
</head>

<body>

<nav class="cyber-nav">
  <div class="nav-logo">MilaWorks<span>Studio</span></div>
  <div class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/contact/">Contact</a>
    <a href="/extras/">Extras</a>
    <a href="/hifend/">Hifend Studio</a>
  </div>
</nav>

<div class="section">
    <h1>Media / Visuals</h1>

    <div class="serpent-divider"></div>

    <div class="gallery">
        <img src="https://cdn-us-hot.rapfa.me/tracks/15987820/bcfd4696-3c33-4861-bfef-5a9ee09420bb_radio.png">
        <img src="https://cdn-us-hot.rapfa.me/tracks/15987820/9d729ee4-e27b-4437-8873-01ae3454b6d8_radio.png">
        <img src="https://cdn-us-hot.rapfa.me/tracks/15987820/23e79590-78c7-41f1-a1fc-0492e904c63a_radio.png">
        <img src="https://cdn-us-hot.rapfa.me/tracks/15987820/b55b4c97-39b9-4a04-817b-b6ef6b9ebf03_radio.png">
    </div>
</div>

</body>
</html>
